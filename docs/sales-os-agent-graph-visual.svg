      .small { font: 12px Arial, sans-serif; fill: #94a3b8; text-anchor: middle; }
      .tiny { font: 11px Arial, sans-serif; fill: #cbd5e1; text-anchor: middle; }
      .edge { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .edge-green { stroke: #34d399; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .edge-pink { stroke: #f472b6; stroke-width: 3; fill: none; marker-end: url(#arrowPink); }
