<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      .bg { fill: #080b12; }
      .grid { stroke: #1f2937; stroke-width: 1; opacity: 0.25; }
      .zone { fill: none; stroke-width: 4; stroke-dasharray: 12 10; rx: 28; }
      .zone-title { font: 700 26px Arial, sans-serif; fill: #0b1020; }
      .node { fill: #111827; stroke: #64748b; stroke-width: 2; rx: 14; }
      .node-blue { fill: #0f172a; stroke: #38bdf8; stroke-width: 2; rx: 14; }
      .node-green { fill: #10231b; stroke: #34d399; stroke-width: 2; rx: 14; }
      .node-yellow { fill: #2b230b; stroke: #facc15; stroke-width: 2; rx: 14; }
      .node-pink { fill: #251020; stroke: #f472b6; stroke-width: 2; rx: 14; }
